name: Weekly Repo Audit
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: 'Audit scope'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - security-only
          - deps-only

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Run deterministic verification suite
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high

      - name: Check OpenRouter API Key
        id: check_key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENROUTER_API_KEY ist nicht gesetzt — deterministische Wochenprüfung war erfolgreich."
          fi

      - name: Run OpenCode Audit
        if: steps.check_key.outputs.enabled == 'true'
        uses: anomalyco/opencode/github@v1
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/google/gemini-2.5-flash
          prompt: |
            Führe einen wöchentlichen Repository-Audit durch (npm):
            1. Prüfe Tests (npm test) und fehlende Randfall-Abdeckung.
            2. Prüfe Dependencies (npm audit / npm outdated).
            3. Prüfe Code-Qualität, Dateigrößen und Dokumentation.
            Erstelle ein strukturiertes GitHub Issue mit Markdown-Tabellen.
